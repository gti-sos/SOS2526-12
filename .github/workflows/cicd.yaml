name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Frontend dependencies
        working-directory: ./src/front
        run: npm install 

      - name: Build UI
        working-directory: ./src/front
        run: npm run build

      - name: Install root dependecies
        run: npm ci
      
      - name: Install Playwright dependencies in Root
        run: npm install -D @playwright/test

      - name: Cache Playwright browser
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/ 

      - name: Run test
        run: npm test

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=critical

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
        
      - name: Deploy to Hugging Face Spaces
        if: github.event_name == 'push' 
        run: |
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git remote add huggingface https://lucperhea:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/lucperhea/sos2526-12
          git push huggingface main --force
