name: CI/CD Pipeline SOS2526-12

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # --- FRONTEND ---
      - name: Install Frontend dependencies
        working-directory: ./src/front
        run: npm install 

      - name: Build UI
        working-directory: ./src/front
        run: npm run build

      # --- BACKEND & TESTS ---
      - name: Install root dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Si tus tests necesitan el secreto de Firebase en el CI, añádelo aquí
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Run unit tests
        run: npm run test:unit || echo "No unit tests found"

      # --- SEGURIDAD Y COBERTURA ---
      - name: Upload coverage to Codecov 
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        continue-on-error: true # Para que no bloquee el deploy si hay avisos menores
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

  deploy:
    needs: test-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    strategy:
      # La matriz permite ejecutar este bloque 3 veces con distintos valores
      matrix:
        include:
          - name: "Lucca"
            user_hf: "lucperhea"
            space_name: "sos2526-12"
            token_secret: "HF_TOKEN_LUCCA"
          - name: "Javier"
            user_hf: "javjimgar1"
            space_name: "SOS2526-12-jjg"
            token_secret: "HF_TOKEN_JAVIER"
          - name: "Companero3"
            user_hf: "USUARIO_COMPA_3"
            space_name: "sos2526-12-compa3"
            token_secret: "HF_TOKEN_COMPANERO3"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to Hugging Face (${{ matrix.name }})
        env:
          # Accedemos al secreto dinámicamente según la matriz
          HF_TOKEN: ${{ secrets[matrix.token_secret] }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "⚠️ Saltando despliegue para ${{ matrix.name }}: Secreto ${{ matrix.token_secret }} no configurado en GitHub."
          else
            echo "🚀 Desplegando en el Space de ${{ matrix.name }}..."
            git config --global user.email "ci@github.com"
            git config --global user.name "GitHub Actions CI"
            
            # Añadir el remoto de Hugging Face usando el token
            git remote add huggingface https://${{ matrix.user_hf }}:$HF_TOKEN@huggingface.co/spaces/${{ matrix.user_hf }}/${{ matrix.space_name }}
            
            # Forzar el push a la rama main de Hugging Face
            git push huggingface main --force
            echo "✅ Despliegue completado para ${{ matrix.name }}."
          fi